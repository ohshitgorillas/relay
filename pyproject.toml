[project]
name = "relay"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
relay = "relay.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-timeout", "pytest-xdist"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relay"]

[tool.pytest.ini_options]
addopts = "-n 2 --dist=load"
timeout = 30
timeout_method = "signal"
